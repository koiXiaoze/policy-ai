name: Government Source Canary

"on":
  schedule:
    # 每日 00:17 UTC（北京时间 08:17）巡检 5 个固定启用来源
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: government-source-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Verify all enabled government sources
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DATABASE_URL: sqlite:///data/source-canary.db
      NOTIFY_CHANNELS: ""
      SOURCE_HEALTH_ALERT_ENABLED: "false"
      AI_API_KEY: ""
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # Logs from scrapers contain source URLs; keep them out of public Actions logs.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Initialize isolated database
        run: |
          mkdir -p reports
          python main.py init
          python -m alembic current

      # 原始报告仅保留在工作区；即使失败也继续，由校验器判断最终门禁。
      # 原始报告和运行日志不上传；公开 Actions 日志仅保留校验器输出的脱敏摘要。
      - name: Remove repository env file before canary
        run: rm -f .env

      - name: Run all-source canary
        env:
          LOG_LEVEL: "CRITICAL"
        id: canary
        continue-on-error: true
        run: |
          : > reports/source-canary-run.log
          python main.py source-canary --json --output reports/source-canary.json \
            >> reports/source-canary-run.log 2>&1

      - name: Collect source diagnostics
        if: always()
        continue-on-error: true
        run: |
          python main.py source-diagnostics --probe --json \
            > reports/source-diagnostics.json 2>> reports/source-canary-run.log

      # Validate the fixed five-source gate and scan logs without echoing matches.
      # The only emitted artifact is the redacted release manifest.
      - name: Validate fixed-source gate and emit release manifest
        id: validate
        if: always()
        run: |
          python scripts/verify_source_canary.py \
            --input reports/source-canary.json \
            --manifest-output reports/release-manifest.json \
            --log reports/source-canary-run.log

      # 仅上传校验器生成的脱敏 Manifest（以及可选的诊断摘要），不上传原始 canary 报告。
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: government-source-canary-${{ github.run_id }}
          path: reports/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      # 最终失败门禁：canary 或校验器任一步失败，任务失败；Artifact 仍已上传。
      - name: Fail job when canary or gate failed
        if: always()
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          echo "canary_outcome=$CANARY_OUTCOME"
          echo "validate_outcome=$VALIDATE_OUTCOME"
          if [ "$CANARY_OUTCOME" != "success" ] || [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "canary 未通过固定 5 来源门禁"
            exit 1
          fi
          echo "全部 5 个固定来源通过"
